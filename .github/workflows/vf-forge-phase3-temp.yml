name: VF Forge Phase3 Temporary Real Environment

on:
  push:
    branches: [vf-forge-ci-temp-20260808]
    paths:
      - '.vf-ci/**'
      - '.github/workflows/vf-forge-phase3-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase3-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4

      - name: Setup PHP 8.2 production dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, zip, fileinfo, openssl
          coverage: none

      - name: Install sqlite3 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Verify runtime
        run: |
          set -euo pipefail
          php -v
          php -r 'foreach (["pdo_sqlite","sqlite3","zip","fileinfo"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "missing:$e\n"); exit(2); } } echo "PHP_EXTENSIONS_OK\n";'
          sqlite3 --version
          tar --version | head -1

      - name: Reconstruct and verify VF Forge source identities
        run: |
          set -euo pipefail
          mkdir -p /tmp/vf-segments
          head -c 20000 .vf-ci/part00 > /tmp/vf-segments/00
          head -c 10000 .vf-ci/part01 > /tmp/vf-segments/01
          head -c 20000 .vf-ci/part02 > /tmp/vf-segments/02
          head -c 20000 .vf-ci/part03 > /tmp/vf-segments/03
          head -c 20000 .vf-ci/part04 > /tmp/vf-segments/04
          head -c 20000 .vf-ci/part05 > /tmp/vf-segments/05
          head -c 20000 .vf-ci/rest   > /tmp/vf-segments/06
          head -c 20000 .vf-ci/part07 > /tmp/vf-segments/07
          head -c 20000 .vf-ci/part08 > /tmp/vf-segments/08
          head -c 17256 .vf-ci/part09 > /tmp/vf-segments/09
          cat /tmp/vf-segments/{00,01,02,03,04,05,06,07,08,09} > /tmp/vf-phase3.b64
          base64 -d /tmp/vf-phase3.b64 > /tmp/vf-phase3-min.tar.xz
          xz -t /tmp/vf-phase3-min.tar.xz
          rm -rf /tmp/vf-phase3-src && mkdir -p /tmp/vf-phase3-src
          tar -xJf /tmp/vf-phase3-min.tar.xz -C /tmp/vf-phase3-src
          grep -q "define('VFAB_VERSION', '1.23.0')" /tmp/vf-phase3-src/current/app/bootstrap.php
          grep -q "define('VFAB_VERSION', '1.21.1')" /tmp/vf-phase3-src/baseline/app/bootstrap.php

          cat > /tmp/current-core-files <<'EOF'
          app/bootstrap.php
          app/Repository.php
          app/BackupService.php
          app/ReleaseService.php
          app/AtomicRepairRuntime.php
          app/MigrationRunner.php
          api.php
          cli/build-atomic.php
          EOF
          : > /tmp/current-core-manifest
          while read -r f; do printf '%s  ' "$f" >> /tmp/current-core-manifest; sha256sum "/tmp/vf-phase3-src/current/$f" | awk '{print $1}' >> /tmp/current-core-manifest; done < /tmp/current-core-files
          echo '13b3d8b4b5d2be916d590acf622a63f722859f0d66bef1404314757a8c16091e  /tmp/current-core-manifest' | sha256sum -c -

          cat > /tmp/baseline-core-files <<'EOF'
          app/bootstrap.php
          app/Repository.php
          app/BackupService.php
          api.php
          EOF
          : > /tmp/baseline-core-manifest
          while read -r f; do printf '%s  ' "$f" >> /tmp/baseline-core-manifest; sha256sum "/tmp/vf-phase3-src/baseline/$f" | awk '{print $1}' >> /tmp/baseline-core-manifest; done < /tmp/baseline-core-files
          echo '8e90373f826a00430e3593e02bd47fdd86f5efe82fc8791a34d564d4e3999929  /tmp/baseline-core-manifest' | sha256sum -c -

          cp .vf-ci/phase3-real-env.sh /tmp/vf-phase3-src/current/tests/phase3-real-env.sh
          echo '23d577138d8244b6e857be825daabcdb8bbf593186503a666df8fff892793515  /tmp/vf-phase3-src/current/tests/phase3-real-env.sh' | sha256sum -c -
          chmod +x /tmp/vf-phase3-src/current/tests/phase3-real-env.sh
          echo PAYLOAD_IDENTITY_OK

      - name: Run real PHP SQLite clean dirty and failure tests
        run: |
          set -euo pipefail
          rm -rf /tmp/vf-phase3-run && mkdir -p /tmp/vf-phase3-run
          /tmp/vf-phase3-src/current/tests/phase3-real-env.sh \
            /tmp/vf-phase3-src/current \
            /tmp/vf-phase3-src/baseline \
            /tmp/vf-phase3-run | tee /tmp/vf-phase3-core.log

      - name: Save runner facts
        if: always()
        run: |
          {
            echo "date_utc=$(date -u +%FT%TZ)"
            echo "runner=${RUNNER_OS:-unknown} ${RUNNER_ARCH:-unknown}"
            php -v | head -1 || true
            sqlite3 --version || true
            php -m | sort || true
          } > /tmp/vf-phase3-runner-facts.txt

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vf-forge-phase3-core-evidence-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            /tmp/vf-phase3-core.log
            /tmp/vf-phase3-runner-facts.txt
            /tmp/vf-phase3-run/**
