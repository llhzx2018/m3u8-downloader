name: vfinfra-php-curl-bundle

on:
  push:
    branches:
      - vftextbox-ci-20260807
    paths:
      - .github/workflows/vfinfra-php-curl-bundle.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Install PHP 8.4 curl extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none
      - name: Bundle curl module
        shell: bash
        run: |
          set -euo pipefail
          php -v
          EXT=$(php-config --extension-dir)
          mkdir -p bundle/extensions
          test -f "$EXT/curl.so"
          cp "$EXT/curl.so" bundle/extensions/
          ldd "$EXT/curl.so" > bundle/ldd.txt || true
          php --ri curl > bundle/curl.txt
          php -i | grep '^PHP API\|^PHP Extension\|^Zend Extension\|^extension_dir' > bundle/php-abi.txt
      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: vfinfra-php84-curl-extension
          path: bundle
          if-no-files-found: error
          retention-days: 1
