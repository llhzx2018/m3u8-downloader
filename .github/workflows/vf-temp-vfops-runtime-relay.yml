name: VF temporary vf-ops runtime relay

on:
  pull_request:
    branches:
      - master
    paths:
      - .vf-temp/vf-ops-r14-runtime-trigger.txt

permissions:
  contents: read

jobs:
  package-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified PHP SQLite modules
        run: |
          set -euo pipefail
          mkdir -p relay/php-modules
          curl -fsSL "https://ftp.debian.org/debian/pool/main/p/php8.4/php8.4-sqlite3_8.4.23-1~deb13u1_amd64.deb" -o php8.4-sqlite3.deb
          echo "0f97148df214bac663e1bcff01883cd8ae93538af84eb551ea7b786b487bd50d  php8.4-sqlite3.deb" | sha256sum -c -
          dpkg-deb -x php8.4-sqlite3.deb php-sqlite
          cp php-sqlite/usr/lib/php/20240924/pdo_sqlite.so relay/php-modules/
          cp php-sqlite/usr/lib/php/20240924/sqlite3.so relay/php-modules/
          file relay/php-modules/*.so

      - name: Download WordPress 7.0.2
        run: |
          set -euo pipefail
          curl -fsSL "https://wordpress.org/wordpress-7.0.2.tar.gz" -o wordpress.tar.gz
          tar -xzf wordpress.tar.gz
          test -f wordpress/wp-includes/version.php
          grep -q "wp_version = '7.0.2'" wordpress/wp-includes/version.php
          mv wordpress relay/wordpress

      - name: Download verified SQLite drop-in and WP-CLI
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/aaemnnosttv/wp-sqlite-db/6933d833c51f06746eb5af2dc8478565c985f957/src/db.php" -o relay/db.php
          test "$(sha1sum relay/db.php | awk '{print $1}')" = "3a01079bb5623b55e806cc1848a75dc0d3539762"
          php -l relay/db.php
          curl -fsSL "https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar" -o relay/wp-cli.phar
          php relay/wp-cli.phar --info

      - name: Write runtime manifest
        run: |
          set -euo pipefail
          cat > relay/runtime-manifest.json <<'JSON'
          {
            "wordpress": "7.0.2",
            "phpApi": "20240924",
            "phpSqliteDebSha256": "0f97148df214bac663e1bcff01883cd8ae93538af84eb551ea7b786b487bd50d",
            "sqliteDropinCommit": "6933d833c51f06746eb5af2dc8478565c985f957",
            "sqliteDropinSha1": "3a01079bb5623b55e806cc1848a75dc0d3539762"
          }
          JSON
          find relay -type f -print0 | sort -z | xargs -0 sha256sum > relay-files.sha256
          mv relay-files.sha256 relay/

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: vf-ops-r14-wordpress-runtime
          path: relay/
          if-no-files-found: error
          retention-days: 1
