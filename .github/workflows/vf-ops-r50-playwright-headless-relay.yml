name: VF Ops R50 Playwright Headless Relay

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vf-ops-r50-playwright-headless-relay.yml'

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Playwright Chromium Headless Shell
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check playwright==1.57.0
          PLAYWRIGHT_BROWSERS_PATH="$PWD/pw-browsers" python -m playwright install --only-shell chromium
          mkdir browser-relay
          cp -a pw-browsers/chromium_headless_shell-* browser-relay/
          cp -a pw-browsers/ffmpeg-* browser-relay/ 2>/dev/null || true
          tar -C browser-relay -czf playwright-chromium-headless.tar.gz .
          sha256sum playwright-chromium-headless.tar.gz > SHA256SUMS.txt
          du -sh playwright-chromium-headless.tar.gz browser-relay
      - name: Upload browser relay
        uses: actions/upload-artifact@v4
        with:
          name: vf-ops-r50-playwright-chromium-headless
          path: |
            playwright-chromium-headless.tar.gz
            SHA256SUMS.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
