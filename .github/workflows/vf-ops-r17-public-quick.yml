name: VF temporary R17 quick public probe

on:
  pull_request:
    branches: [master]
    paths:
      - .vf-temp/vf-ops-r17-public-quick-trigger.txt
      - .github/workflows/vf-ops-r17-public-quick.yml

permissions:
  contents: read

jobs:
  quick-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare HTTP probe
        run: python3 -m pip install --disable-pip-version-check --quiet requests
      - name: Probe DNS TLS and HTTP
        run: |
          cat > quick_probe.py <<'PY'
          import json, re, socket, ssl, time
          from datetime import datetime, timezone
          from urllib.parse import urljoin, urlparse
          import requests

          BASES = [
              'https://www3.m3u8.one',
              'https://ilovem3u8.pages.dev',
              'https://cb63b8c9.ilovem3u8.pages.dev',
              'https://19d882ca.ilovem3u8.pages.dev',
              'https://4906c69c.ilovem3u8.pages.dev',
              'https://cb7c511d.ilovem3u8.pages.dev',
              'https://19161550.ilovem3u8.pages.dev',
          ]
          PATHS = ['/', '/zh/', '/sitemap.xml', '/robots.txt', '/404.html', '/problems/', '/zh/problems/', '/m3u8-player/', '/vf-r17-missing-page-404/']

          def dns(host):
              try:
                  return sorted({x[4][0] for x in socket.getaddrinfo(host, 443, proto=socket.IPPROTO_TCP)}), None
              except Exception as exc:
                  return [], f'{type(exc).__name__}: {exc}'

          def tls(host):
              try:
                  ctx = ssl.create_default_context()
                  with socket.create_connection((host, 443), timeout=12) as sock:
                      with ctx.wrap_socket(sock, server_hostname=host) as ssock:
                          cert = ssock.getpeercert()
                  return {'subject': dict(x[0] for x in cert.get('subject', [])), 'issuer': dict(x[0] for x in cert.get('issuer', [])), 'notBefore': cert.get('notBefore'), 'notAfter': cert.get('notAfter')}, None
              except Exception as exc:
                  return None, f'{type(exc).__name__}: {exc}'

          report = {'generatedAt': datetime.now(timezone.utc).isoformat(), 'bases': []}
          session = requests.Session(); session.headers['User-Agent'] = 'VF-Ops-R17-Quick-Probe/1.0'
          for base in BASES:
              host = urlparse(base).hostname
              addresses, dns_error = dns(host)
              tls_info, tls_error = tls(host)
              item = {'base': base, 'addresses': addresses, 'dnsError': dns_error, 'tls': tls_info, 'tlsError': tls_error, 'checks': []}
              for path in PATHS:
                  url = urljoin(base + '/', path.lstrip('/'))
                  row = {'url': url, 'status': None, 'finalUrl': None, 'contentType': None, 'bytes': 0, 'elapsedMs': None, 'title': None, 'canonical': None, 'server': None, 'cfRay': None, 'error': None}
                  started = time.time()
                  try:
                      r = session.get(url, timeout=20, allow_redirects=True)
                      row.update(status=r.status_code, finalUrl=r.url, contentType=r.headers.get('content-type'), bytes=len(r.content), elapsedMs=round((time.time()-started)*1000, 1), server=r.headers.get('server'), cfRay=r.headers.get('cf-ray'))
                      text = r.text[:500000]
                      m = re.search(r'<title[^>]*>(.*?)</title>', text, re.I|re.S)
                      if m: row['title'] = ' '.join(m.group(1).split())[:300]
                      m = re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)', text, re.I)
                      if not m: m = re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']', text, re.I)
                      if m: row['canonical'] = m.group(1)
                  except Exception as exc:
                      row['elapsedMs'] = round((time.time()-started)*1000, 1)
                      row['error'] = f'{type(exc).__name__}: {exc}'
                  item['checks'].append(row)
              ok = sum(1 for x in item['checks'] if x['status'] and (200 <= x['status'] < 400 or ('missing-page' in x['url'] and x['status'] == 404)))
              item['summary'] = {'dns': bool(addresses), 'httpPass': f'{ok}/{len(PATHS)}', 'reachable': any(x['status'] is not None for x in item['checks'])}
              report['bases'].append(item)
          with open('vf-ops-r17-public-quick.json', 'w', encoding='utf-8') as f: json.dump(report, f, ensure_ascii=False, indent=2)
          lines=[]
          for item in report['bases']:
              line=f"{item['base']} DNS={'PASS' if item['summary']['dns'] else 'FAIL'} HTTP={item['summary']['httpPass']}"
              lines.append(line); print(line)
          open('vf-ops-r17-public-quick-summary.txt','w',encoding='utf-8').write('\n'.join(lines)+'\n')
          PY
          python3 quick_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: vf-ops-r17-public-quick
          path: |
            vf-ops-r17-public-quick.json
            vf-ops-r17-public-quick-summary.txt
          if-no-files-found: error
          retention-days: 1
