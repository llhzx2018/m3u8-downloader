name: VF Start Phase3 Runtime Relay

on:
  push:
    branches: [vf-start-phase3-ci]
    paths:
      - '.github/workflows/vf-start-phase3-runtime-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install Debian 13 production dependencies
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            php-cli php-fpm php-sqlite3 php-curl php-zip php-xml sqlite3 curl nginx ca-certificates xz-utils
          php -v
          php -r 'var_export(PDO::getAvailableDrivers()); echo "\n";'
          php -r 'foreach(["pdo_sqlite","curl","zip","SimpleXML"] as $x){echo $x,":",extension_loaded($x)?"yes":"no","\n";}'
          sqlite3 --version

      - name: Pack runtime relay
        shell: bash
        run: |
          set -euxo pipefail
          EXT="$(php -r 'echo ini_get("extension_dir");')"
          mkdir -p /relay/php-ext /relay/bin /relay/meta
          for f in pdo_sqlite.so sqlite3.so curl.so zip.so dom.so simplexml.so xml.so xmlreader.so xmlwriter.so xsl.so; do
            [[ -f "$EXT/$f" ]] && cp -a "$EXT/$f" /relay/php-ext/
          done
          cp -a /usr/bin/sqlite3 /relay/bin/
          FPM="$(command -v php-fpm8.4 || command -v php-fpm)"
          cp -a "$FPM" /relay/bin/
          php -v > /relay/meta/php-version.txt
          php -m > /relay/meta/php-modules.txt
          ldd /relay/php-ext/pdo_sqlite.so > /relay/meta/pdo_sqlite-ldd.txt
          ldd /relay/bin/sqlite3 > /relay/meta/sqlite3-ldd.txt
          tar -C /relay -cJf /tmp/vf-start-phase3-runtime-relay.tar.xz .
          sha256sum /tmp/vf-start-phase3-runtime-relay.tar.xz

      - name: Upload runtime relay
        uses: actions/upload-artifact@v4
        with:
          name: vf-start-phase3-runtime-relay
          path: /tmp/vf-start-phase3-runtime-relay.tar.xz
          retention-days: 1
          compression-level: 0
