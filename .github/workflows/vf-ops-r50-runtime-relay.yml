name: VF Ops R50 Runtime Relay

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vf-ops-r50-runtime-relay.yml'

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare runtime bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime

          curl -fsSL --retry 3 \
            -o runtime/mariaDB4j-db-linux64-11.4.5.jar \
            https://repo1.maven.org/maven2/ch/vorburger/mariaDB4j/mariaDB4j-db-linux64/11.4.5/mariaDB4j-db-linux64-11.4.5.jar
          curl -fsSL --retry 3 \
            -o runtime/mariaDB4j-db-linux64-11.4.5.jar.sha1 \
            https://repo1.maven.org/maven2/ch/vorburger/mariaDB4j/mariaDB4j-db-linux64/11.4.5/mariaDB4j-db-linux64-11.4.5.jar.sha1
          (cd runtime && echo "$(cat mariaDB4j-db-linux64-11.4.5.jar.sha1)  mariaDB4j-db-linux64-11.4.5.jar" | sha1sum -c -)

          for ext in mysql xml mbstring curl gd intl zip; do
            curl -fsSL --retry 3 \
              -o "runtime/php8.4-${ext}_8.4.24-1~deb13u1_amd64.deb" \
              "https://security.debian.org/debian-security/pool/updates/main/p/php8.4/php8.4-${ext}_8.4.24-1~deb13u1_amd64.deb"
          done

          curl -fsSL --retry 3 -o runtime/wordpress-latest.zip https://wordpress.org/latest.zip
          sha256sum runtime/* > runtime/SHA256SUMS.txt

      - name: Upload runtime relay
        uses: actions/upload-artifact@v4
        with:
          name: vf-ops-r50-runtime-relay
          path: runtime/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
