name: VF temporary R15 PHP mysqlnd relay

on:
  pull_request:
    branches: [master]
    paths:
      - .vf-temp/vf-ops-r15-mysqlnd-trigger.txt

permissions:
  contents: read

jobs:
  package-module:
    runs-on: ubuntu-latest
    steps:
      - name: Download PHP mysqlnd module
        run: |
          set -euo pipefail
          mkdir -p relay
          curl --retry 3 --retry-delay 2 -fsSL "https://ftp.debian.org/debian/pool/main/p/php8.4/php8.4-common_8.4.23-1~deb13u1_amd64.deb" -o php8.4-common.deb
          dpkg-deb -x php8.4-common.deb php-common
          cp php-common/usr/lib/php/20240924/mysqlnd.so relay/
          sha256sum php8.4-common.deb > relay/php8.4-common-deb.sha256
          file relay/mysqlnd.so
      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: vf-ops-r15-php-mysqlnd
          path: relay/
          if-no-files-found: error
          retention-days: 1
