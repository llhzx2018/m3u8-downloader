name: VF Forge Historical V2 Payload Recovery

on:
  push:
    branches: [vf-forge-recovery-temp-20260808]
    paths:
      - '.github/workflows/vf-forge-recovery-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and inspect v2 payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v2 /tmp/evidence
          for n in 00 01 02 03; do git show 35dc46ad:.vf-ci-v2/chunk$n > /tmp/v2/chunk$n; done
          cat /tmp/v2/chunk{00,01,02,03} > /tmp/v2/payload.b64
          printf 'b64_bytes=%s\n' "$(wc -c < /tmp/v2/payload.b64)" | tee /tmp/evidence/summary.txt
          printf 'b64_sha256=%s\n' "$(sha256sum /tmp/v2/payload.b64 | awk '{print $1}')" | tee -a /tmp/evidence/summary.txt
          base64 -d /tmp/v2/payload.b64 > /tmp/v2/payload.tar.xz
          printf 'xz_bytes=%s\n' "$(wc -c < /tmp/v2/payload.tar.xz)" | tee -a /tmp/evidence/summary.txt
          printf 'xz_sha256=%s\n' "$(sha256sum /tmp/v2/payload.tar.xz | awk '{print $1}')" | tee -a /tmp/evidence/summary.txt
          xz -t /tmp/v2/payload.tar.xz
          mkdir -p /tmp/recovered
          tar -xJf /tmp/v2/payload.tar.xz -C /tmp/recovered
          find /tmp/recovered -type f -printf '%P\n' | sort | tee /tmp/evidence/files.txt
          find /tmp/recovered -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/evidence/file-sha256.txt
          printf 'file_count=%s\n' "$(wc -l < /tmp/evidence/files.txt)" | tee -a /tmp/evidence/summary.txt
          grep -R "VFAB_VERSION" /tmp/recovered | head -20 | tee /tmp/evidence/version-lines.txt || true
          grep -R "VFAB_SCHEMA_VERSION" /tmp/recovered | head -20 | tee /tmp/evidence/schema-lines.txt || true
          if [ -f /tmp/recovered/current/app/bootstrap.php ]; then
            grep "VFAB_VERSION\|VFAB_SCHEMA_VERSION" /tmp/recovered/current/app/bootstrap.php | tee /tmp/evidence/current-bootstrap-version.txt
          fi
          if [ -f /tmp/recovered/app/bootstrap.php ]; then
            grep "VFAB_VERSION\|VFAB_SCHEMA_VERSION" /tmp/recovered/app/bootstrap.php | tee /tmp/evidence/root-bootstrap-version.txt
          fi
          tar -C /tmp/recovered -czf /tmp/v2/recovered-v2.tar.gz .
          sha256sum /tmp/v2/recovered-v2.tar.gz | tee /tmp/evidence/recovered-v2-tar.sha256
          echo 'V2_PAYLOAD_RECOVERY=PASS' | tee -a /tmp/evidence/summary.txt
      - name: Upload recovered v2 payload
        uses: actions/upload-artifact@v4
        with:
          name: vf-forge-historical-v2-payload-recovered
          path: |
            /tmp/evidence/**
            /tmp/v2/recovered-v2.tar.gz
          compression-level: 0
