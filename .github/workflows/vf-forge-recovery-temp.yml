name: VF Forge Repair Fragment Diff Export

on:
  push:
    branches: [vf-forge-recovery-temp-20260808]
    paths:
      - '.github/workflows/vf-forge-recovery-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-fragments:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export fragment candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fragments /tmp/evidence
          git show 172564d65afd2599e63143a61258281c26f4b646:.vf-ci-fix/p05a > /tmp/fragments/fix-p05a
          git show 1fc33d540e20055921a7ee2cb635402b6fdafee4:.vf-ci-cur/p05a > /tmp/fragments/cur-p05a
          git show aea66d8091aab595fc2e16c86891e0b0834ae3b6:.vf-ci/part05 > /tmp/fragments/original-p05
          git show 6410e0aa9813115ece22cee803f2fc779580840b:.vf-ci/part05 > /tmp/fragments/repair-p05
          for f in /tmp/fragments/*; do printf '%s|%s|%s\n' "$(basename "$f")" "$(wc -c < "$f")" "$(sha256sum "$f" | awk '{print $1}')"; done | tee /tmp/evidence/map.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          fs={p.name:p.read_bytes() for p in Path('/tmp/fragments').iterdir()}
          names=sorted(fs)
          out=[]
          for i,a in enumerate(names):
              for b in names[i+1:]:
                  x,y=fs[a],fs[b]
                  pref=0
                  for u,v in zip(x,y):
                      if u!=v: break
                      pref+=1
                  suff=0
                  for u,v in zip(reversed(x),reversed(y)):
                      if u!=v: break
                      suff+=1
                  out.append(f'{a} vs {b}: len={len(x)}/{len(y)} common_prefix={pref} common_suffix={suff}')
                  # locate x inside y or vice versa when possible
                  out.append(f'  {a}_in_{b}={y.find(x)} {b}_in_{a}={x.find(y)}')
          # Base64 transport validity and suspicious characters
          alpha=set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          for n,x in fs.items():
              bad=[(i,c) for i,c in enumerate(x) if c not in alpha]
              out.append(f'{n}: bad_count={len(bad)} first_bad={bad[:20]} tail={x[-80:]!r}')
          Path('/tmp/evidence/diff.txt').write_text('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY
      - name: Upload fragment bytes
        uses: actions/upload-artifact@v4
        with:
          name: vf-forge-repair-fragment-byte-diff
          path: |
            /tmp/fragments/**
            /tmp/evidence/**
          compression-level: 0
