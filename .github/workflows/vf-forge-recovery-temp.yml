name: VF Forge Historical Fragment Export

on:
  push:
    branches: [vf-forge-recovery-temp-20260808]
    paths:
      - '.github/workflows/vf-forge-recovery-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export raw historical objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw /tmp/evidence
          git show aea66d8091aab595fc2e16c86891e0b0834ae3b6:.vf-ci/part05 > /tmp/raw/part05-original
          git show 6410e0aa9813115ece22cee803f2fc779580840b:.vf-ci/part05 > /tmp/raw/part05-repair
          git show 71833cb47927d2a2bd9f6e8b0eaedc224fe7fcdb:.vf-ci/rest > /tmp/raw/rest
          git show ce2cf857df2142e68b4968b1dd5897f15caf2e89:.vf-ci/part07 > /tmp/raw/part07
          git show fa4fb13e93bb1b4c322a0a589011d48deaa75db8:.vf-ci/part08 > /tmp/raw/part08
          git show 59896e24eb288eed0bc7ce1f951400fcb1780885:.vf-ci/part09 > /tmp/raw/part09
          for f in /tmp/raw/*; do printf '%s bytes=%s sha=%s\n' "$(basename "$f")" "$(wc -c < "$f")" "$(sha256sum "$f" | awk '{print $1}')"; done | tee /tmp/evidence/raw-map.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
            '06':'edfd01e6f46807600adf068ad43104e9019cad8d7217191df1b26da45adcfb51',
            '07':'5677c556457eb042ea2db55684d3d5fb88e3269c31b0813a55b865e2738c9fb8',
            '08':'ddb907326942eb4391ba2c0883d1bce3b1605053a380669d4eb4c7180027f4c9',
            '09':'45cdec81e7f9c47377d6a5a1d8186350595441fb0b6017fc5fe297d26c890f78',
          }
          data=Path('/tmp/raw/rest').read_bytes()
          out=[]
          out.append(f'rest_len={len(data)}')
          for off in [0,10000,20000,30000,40000,50000,60000]:
              if off < len(data):
                  chunk=data[off:off+20000]
                  out.append(f'rest_window off={off} len={len(chunk)} sha={hashlib.sha256(chunk).hexdigest()}')
          # Search exact desired 20k chunk hash at every Base64 quantum boundary.
          for label,want in expected.items():
              found=[]
              size=17256 if label=='09' else 20000
              for off in range(0,max(0,len(data)-size+1),4):
                  if hashlib.sha256(data[off:off+size]).hexdigest()==want:
                      found.append(off)
              out.append(f'expected_{label}_offsets={found}')
          Path('/tmp/evidence/rest-analysis.txt').write_text('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY
      - name: Upload raw fragments
        uses: actions/upload-artifact@v4
        with:
          name: vf-forge-historical-raw-fragments
          path: |
            /tmp/raw/**
            /tmp/evidence/**
          compression-level: 0
