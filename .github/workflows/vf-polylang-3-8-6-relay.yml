name: VF Polylang 3.8.6 official relay

on:
  push:
    paths:
      - '.github/workflows/vf-polylang-3-8-6-relay.yml'

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download and verify official Polylang package
        shell: bash
        run: |
          set -euxo pipefail
          VERSION='3.8.6'
          URL="https://downloads.wordpress.org/plugin/polylang.${VERSION}.zip"
          curl --retry 4 --retry-delay 2 -fsSL "$URL" -o polylang.zip
          unzip -q polylang.zip -d unpacked
          test -f unpacked/polylang/polylang.php
          grep -Eq '^ \* Version:[[:space:]]+3\.8\.6' unpacked/polylang/polylang.php
          sha256sum polylang.zip > polylang.zip.sha256
          unzip -t polylang.zip
          find unpacked/polylang -type f | sort > package-files.txt
          printf '{"source":"%s","version":"%s","plugin_file":"polylang/polylang.php"}\n' "$URL" "$VERSION" > package-manifest.json
      - name: Upload verified official package
        uses: actions/upload-artifact@v4
        with:
          name: polylang-3.8.6-official
          path: |
            polylang.zip
            polylang.zip.sha256
            package-files.txt
            package-manifest.json
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
