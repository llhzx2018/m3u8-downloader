name: VF temporary R16 dependency relay

on:
  pull_request:
    branches: [master]
    paths:
      - .vf-temp/vf-ops-r16-php-trigger.txt

permissions:
  contents: read

jobs:
  package-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Download official WordPress dependency packages
        run: |
          set -euo pipefail
          mkdir -p relay
          curl --retry 3 --retry-delay 2 -fsSL "https://downloads.wordpress.org/plugin/seo-by-rank-math.1.0.275.zip" -o relay/seo-by-rank-math.1.0.275.zip
          curl --retry 3 --retry-delay 2 -fsSL "https://downloads.wordpress.org/plugin/polylang.3.8.6.zip" -o relay/polylang.3.8.6.zip
          unzip -t relay/seo-by-rank-math.1.0.275.zip
          unzip -t relay/polylang.3.8.6.zip
          sha256sum relay/*.zip > relay/packages.sha256
      - name: Upload dependency artifact
        uses: actions/upload-artifact@v4
        with:
          name: vf-ops-r16-wordpress-dependencies
          path: relay/
          if-no-files-found: error
          retention-days: 1
