name: VF Theme Playwright 1.57 headless relay

on:
  push:
    paths:
      - '.github/workflows/vf-theme-playwright-1-57-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install exact Playwright browser
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --user 'playwright==1.57.0'
          python3 -m playwright install chromium-headless-shell
          find "$HOME/.cache/ms-playwright" -maxdepth 2 -type f -name 'chrome-headless-shell' -print
      - name: Package exact headless shell
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifact
          cp -a "$HOME/.cache/ms-playwright/chromium_headless_shell-1200" artifact/
          tar -C artifact -czf playwright-1.57.0-chromium-headless-shell-1200.tar.gz chromium_headless_shell-1200
          sha256sum playwright-1.57.0-chromium-headless-shell-1200.tar.gz > playwright-1.57.0-chromium-headless-shell-1200.tar.gz.sha256
      - name: Upload browser runtime
        uses: actions/upload-artifact@v4
        with:
          name: vf-theme-playwright-1-57-headless-shell
          path: |
            playwright-1.57.0-chromium-headless-shell-1200.tar.gz
            playwright-1.57.0-chromium-headless-shell-1200.tar.gz.sha256
          retention-days: 2
          compression-level: 0
